---
- name: Gather system facts
  ansible.builtin.setup:
    gather_subset:
      - "!all"
      - "!min"
      - distribution
      - kernel
      - pkg_mgr
  ignore_unreachable: true

- name: Collect versions on reachable hosts
  when: ansible_facts.distribution is defined
  block:

    - name: Describe the system
      ansible.builtin.set_fact:
        software_versions:
          os: "{{ ansible_facts.distribution }}"
          os_version: "{{ ansible_facts.distribution_version }}"
          os_major: "{{ ansible_facts.distribution_major_version }}"
          os_release: "{{ ansible_facts.distribution_release }}"
          os_family: "{{ ansible_facts.os_family }}"
          pkg_mgr: "{{ ansible_facts.pkg_mgr }}"
          kernel: "{{ ansible_facts.kernel }}"
          arch: "{{ ansible_facts.architecture | default(software_versions_absent) }}"

    - name: Collect installed versions
      ansible.builtin.shell: |
        set -o pipefail
        {% if item.binary is defined %}
        command -v {{ item.binary }} >/dev/null 2>&1 || exit 127
        {% endif %}
        {{ item.command }} 2>&1 | head -n 1
      args:
        executable: /bin/bash
      register: software_versions_raw
      changed_when: false
      failed_when: false
      check_mode: false
      loop: "{{ software_versions_list }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Add each version to the table
      ansible.builtin.set_fact:
        software_versions: >-
          {{ software_versions | combine({item.item.name: found | first | default(software_versions_absent, true)}) }}
      vars:
        found: "{{ item.stdout | regex_findall(item.item.regex | default(software_versions_regex)) }}"
      loop: "{{ software_versions_raw.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: Show collected versions
      ansible.builtin.debug:
        var: software_versions
